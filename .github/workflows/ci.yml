name: CI

# Build, bit-exact verification, and performance gate for npu-hotspot-asm.
on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build-and-test:
    name: ${{ matrix.os }} / ${{ matrix.cc }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest ]
        cc: [ gcc, clang ]
    env:
      CC: ${{ matrix.cc }}
    steps:
      - uses: actions/checkout@v4

      - name: Install clang
        if: matrix.cc == 'clang'
        run: sudo apt-get update && sudo apt-get install -y clang

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release -j

      - name: Test (bit-exact verification)
        run: ./build/npu_tests

      - name: Benchmark (performance gate)
        run: NPU_MIN_SPEEDUP=1.5 ./build/npu_bench
